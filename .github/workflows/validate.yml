name: Validate skills

on:
  push:
    paths:
      - "skills/**"
      - "scripts/**"
      - "skills-index.json"
      - "SKILLS_INDEX.md"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "skills/**"
      - "scripts/**"
      - "skills-index.json"
      - "SKILLS_INDEX.md"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/validate-skills.py
      - run: python scripts/build-index.py
      - run: git diff --exit-code -- SKILLS_INDEX.md skills-index.json
