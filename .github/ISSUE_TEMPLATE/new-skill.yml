name: Propose a skill
description: Propose an original or license-verified skill.
labels: ["skill"]
body:
  - type: input
    id: name
    attributes:
      label: Skill name
      placeholder: example-skill
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source and license evidence
      description: Include the upstream URL, path, license, and commit if adapted.
    validations:
      required: true
